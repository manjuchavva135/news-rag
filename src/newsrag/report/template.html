<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 1 quality report</title>
<style>
:root { --bg: #fbfbf9; --fg: #1d1d1b; --muted: #66665f; --line: #deded8; --card: #ffffff;
  --pass: #1f7a3a; --pass-bg: #e3f3e7; --fail: #b3261e; --fail-bg: #fbe5e3; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --fg: #ececea; --muted: #a3a39c; --line: #34342f; --card: #1f1f1d;
    --pass: #7fd394; --pass-bg: #1d3524; --fail: #ff9b92; --fail-bg: #3d1f1c; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Telugu", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.6rem; margin: 0.2rem 0 0.3rem; }
h2 { font-size: 1.15rem; margin: 2rem 0 0.5rem; border-bottom: 1px solid var(--line);
  padding-bottom: 0.25rem; }
h3 { font-size: 0.95rem; margin: 1rem 0 0.35rem; color: var(--muted); }
p.meta { color: var(--muted); margin: 0 0 1rem; font-size: 0.85rem; }
.verdict { display: inline-block; padding: 0.35rem 0.75rem; border-radius: 6px; font-weight: 700; }
.PASS { color: var(--pass); background: var(--pass-bg); }
.FAIL { color: var(--fail); background: var(--fail-bg); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; background: var(--card);
  font-size: 0.85rem; }
th, td { text-align: left; vertical-align: top; padding: 0.4rem 0.45rem;
  border-bottom: 1px solid var(--line); overflow-wrap: anywhere; word-break: break-word; }
th { color: var(--muted); font-weight: 600; }
td.num { font-variant-numeric: tabular-nums; }
.status { font-weight: 700; padding: 0.1rem 0.35rem; border-radius: 4px; }
.note { color: var(--muted); font-size: 0.8rem; display: block; margin-top: 0.15rem; }
.na { color: var(--muted); font-style: italic; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; max-width: 100%;
  background: var(--card); border: 1px solid var(--line); padding: 0.6rem; font-size: 0.75rem;
  overflow-x: hidden; }
a { color: inherit; }
.bars td:nth-child(1) { width: 34%; }
@media (max-width: 600px) {
  .bars thead { display: none; }
  .bars tr { display: block; border-bottom: 1px solid var(--line); padding: 0.35rem 0; }
  .bars td { display: block; border: 0; padding: 0.1rem 0.45rem; width: auto !important; }
  .bars td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
}
</style>
</head>
<body>
<main>
<h1><span class="verdict $phase">$header</span></h1>
<p class="meta">Generated $generated_at by <code>newsrag report build</code>. Numbers also in
<a href="report.json">report.json</a>.</p>
<h2>Pass bars</h2>
$bars
$sections
</main>
</body>
</html>
