# Model profiles for newsrag.models (ticket 006). Only models that fit the GPU may be listed:
# `uv run newsrag models fit` must print fit=yes for every profile.
#
# kind: vlm | llm  -> served by vLLM (envs/vllm) with an OpenAI-compatible API on 127.0.0.1
#       embed      -> loaded in-process by sentence-transformers
profiles:
  - name: qwen3-vl-32b
    hf_id: Qwen/Qwen3-VL-32B-Instruct
    family: qwen
    kind: vlm
    dtype: bfloat16
    max_model_len: 65536  # room for a 5376-px page, the block list and 4096 output tokens
    gpu_memory_utilization: 0.90
    extra_args:
      - --limit-mm-per-prompt
      - '{"image": 1}'
      - --mm-processor-kwargs
      - '{"max_pixels": 20000000}'  # so a 5376-px page is not silently shrunk

  # The same weights quantised to fp8 when vLLM loads them: half the weight bytes, so faster
  # decoding and room for more requests in the KV cache (ticket 012 NFR-2 measurements).
  - name: qwen3-vl-32b-fp8
    hf_id: Qwen/Qwen3-VL-32B-Instruct
    family: qwen
    kind: vlm
    dtype: bfloat16
    max_model_len: 65536
    gpu_memory_utilization: 0.90
    extra_args:
      - --quantization
      - fp8
      - --limit-mm-per-prompt
      - '{"image": 1}'
      - --mm-processor-kwargs
      - '{"max_pixels": 20000000}'

  - name: gemma3-27b
    hf_id: google/gemma-3-27b-it
    family: gemma
    kind: vlm
    dtype: bfloat16
    max_model_len: 16384
    gpu_memory_utilization: 0.90
    extra_args:
      - --limit-mm-per-prompt
      - '{"image": 1}'
      - --mm-processor-kwargs
      - '{"do_pan_and_scan": true}'  # so a full page is not read at 896 px

  - name: qwen3-30b-a3b
    hf_id: Qwen/Qwen3-30B-A3B-Instruct-2507
    family: qwen
    kind: llm
    dtype: bfloat16
    max_model_len: 32768
    gpu_memory_utilization: 0.90

  - name: bge-m3
    hf_id: BAAI/bge-m3
    family: bge
    kind: embed
    dtype: float16
    dim: 1024
    query_prefix: ""
    doc_prefix: ""
