[project]
name = "newsrag"
version = "0.1.0"
description = "Sakshi newspaper RAG, phase 1: process newspaper archives into search stores"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasketch>=2.0.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "openai>=1.50",
    "opensearch-py>=2.7",
    "packaging>=24",
    "pillow>=10.4",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "qdrant-client>=1.16,<1.17",  # match the qdrant server (v1.16.1)
    "ruamel.yaml>=0.18",
    "sarvamai>=0.1.45",
    "sentence-transformers>=3.3",
    "torch>=2.7",  # CUDA 12.8+ build (Blackwell), from the pytorch-cu128 index below
    "typer>=0.12",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.scripts]
newsrag = "newsrag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
# specs/ is the requirements record (Markdown); ruff 0.17+ would otherwise format its code blocks.
extend-exclude = ["specs"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: needs the GPU",
    "data: needs extracted archive data under raw_root",
    "stores: needs the docker stores running",
]
