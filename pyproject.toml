[project]
name = "newsrag"
version = "0.1.0"
description = "Sakshi newspaper RAG, phase 1: process newspaper archives into search stores"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
]

[project.scripts]
newsrag = "newsrag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsrag"]

[tool.ruff]
line-length = 100
target-version = "py312"
# specs/ is the requirements record (Markdown); ruff 0.17+ would otherwise format its code blocks.
extend-exclude = ["specs"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "gpu: needs the GPU",
    "data: needs extracted archive data under raw_root",
    "stores: needs the docker stores running",
]
